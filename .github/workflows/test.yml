name: deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: node:24

    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
